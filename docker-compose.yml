# docker compose up -d --build     — build and start
# Data (flows, memory banks, files) live in host volumes/directories and survive container removal.
# Do not use `docker compose down -v`: the -v flag also removes volumes.
services:
  fl0w:
    image: ${FL0W_IMAGE:-fl0w:local}
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "${FL0W_BIND:-127.0.0.1}:${FL0W_PORT:-3000}:3000"
    # FL0W_ALLOW_SHELL, FL0W_PUBLIC_URL, FL0W_SECRET_* and the rest come from .env (if the file is missing, defaults apply)
    env_file:
      - path: .env
        required: false
    volumes:
      - ${FL0W_DATA:-fl0w-data}:/data
      - ${FL0W_FILES:-fl0w-files}:/data/files

volumes:
  fl0w-data:
  fl0w-files:
